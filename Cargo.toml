[workspace]
resolver = "2"
members = [
    "crates/ui_shell",
    "crates/editor_core",
    "crates/languages",
    "crates/lsp_bridge",
    "crates/dap_bridge",
    "crates/tasks",
    "crates/gitx",
    "crates/agents",
    "crates/security",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["RustIDE Contributors"]
repository = "https://github.com/vzwjustin/Rustide"

[workspace.dependencies]
# UI Framework
gpui = "0.2"

# Tree-sitter for syntax highlighting
tree-sitter = "0.22"
tree-sitter-highlight = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-python = "0.21"
tree-sitter-c = "0.21"
tree-sitter-go = "0.21"
tree-sitter-json = "0.21"
tree-sitter-toml-ng = "0.7"
tree-sitter-md = "0.5"

# Async runtime
tokio = { version = "1.43", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# LSP/DAP protocols
lsp-types = "0.97"
dap-types = "0.1"

# Text handling
ropey = "1.6"
unicode-segmentation = "1.12"

# Data structures
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# File system
notify = "7.0"
walkdir = "2.5"
globset = "0.4"

# Git
git2 = "0.19"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Utilities
parking_lot = "0.12"
crossbeam-channel = "0.5"
once_cell = "1.20"
regex = "1.11"
fuzzy-matcher = "0.3"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Testing
tempfile = "3.14"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3
